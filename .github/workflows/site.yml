name: site
# Publishes the site with GitHub Pages (Settings → Pages → Source: GitHub Actions).
# A push to main publishes the pages as they are. A signal from lp-bench/proofbench
# (sent by its workflow notify-website.yml after every push) or a manual run first
# regenerates the problem list and the counts from the problem database, commits them
# if anything changed, and then publishes.
# While lp-bench/proofbench is private, reading it uses a short-lived key of the
# proof-bench GitHub App (secrets PROOFBENCH_APP_ID and PROOFBENCH_APP_KEY).
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [proofbench-updated]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_ID: ${{ secrets.PROOFBENCH_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Create a key for reading lp-bench/proofbench
        id: app
        if: github.event_name != 'push' && env.APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PROOFBENCH_APP_ID }}
          private-key: ${{ secrets.PROOFBENCH_APP_KEY }}
          owner: lp-bench
          repositories: proofbench

      - name: Fetch the problem database
        if: github.event_name != 'push'
        uses: actions/checkout@v4
        with:
          repository: lp-bench/proofbench
          path: .proofbench
          token: ${{ steps.app.outputs.token || github.token }}
          sparse-checkout: ProofBench/DATABASE

      - name: Regenerate the problem list and the counts
        if: github.event_name != 'push'
        run: |
          python3 scripts/build_problems.py .proofbench/ProofBench/DATABASE/Database.json
          rm -rf .proofbench

      - name: Commit if anything changed
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Problem list unchanged."
          else
            git commit -m "Update the problem list from lp-bench/proofbench"
            git pull --rebase --quiet origin main
            git push
          fi

      - name: Package the site
        if: github.event.repository.private == false
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
